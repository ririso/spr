spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      schema-locations: classpath:schema.sql
      mode: always

mybatis:
  mapper-locations: classpath:com/spr/infrastructure/mapper/*.xml
  type-aliases-package: com.spr.application.dto

logging:
  level:
    org.mybatis: DEBUG
    org.springframework.jdbc: DEBUG